name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true
      - name: Test
        run: CGO_ENABLED=1 go test ./...
      - name: Race tests
        run: CGO_ENABLED=1 go test -race ./...
      - name: Vet
        run: CGO_ENABLED=1 go vet ./...
      - name: README validation
        run: python3 scripts/validate_readme.py
      - name: Validator tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Static build
        run: make static
      - name: Verify static ELF
        run: |
          file dist/hibp
          ldd dist/hibp 2>&1 | tee /tmp/hibp-ldd.txt || true
          grep -q 'not a dynamic executable' /tmp/hibp-ldd.txt
      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...

  production-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build -f build/Dockerfile -t hibp-production .
      - name: Verify production binary
        run: docker run --rm hibp-production version
