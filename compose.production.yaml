# HIBP production controller, pulled from GHCR.
#
# Keep runtime data and secrets next to this file:
#
#   .
#   ├── compose.production.yaml
#   ├── .env.production
#   ├── data/
#   │   ├── hibp.db
#   │   ├── hibp.db.meta
#   │   ├── hibp-jobs/
#   │   └── backups/
#   └── secrets/
#       ├── db.passphrase
#       └── ssh/
#           ├── config
#           └── id_ed25519
#
# Prepare the directories with the container UID:
#
#   sudo install -d -o 65532 -g 65532 -m 0700 data data/backups
#   sudo install -d -o 65532 -g 65532 -m 0700 secrets secrets/ssh
#
#   cp .env.production.example .env.production
#   docker compose --env-file .env.production -f compose.production.yaml up -d
#
# First run with a new database only: add --create to the command, complete the
# admin/MFA setup, then remove --create and restart. Do not add --create when
# migrating an existing database. Do not run two controllers against one
# database.
#
# Relative HIBP_DATA_DIR, HIBP_SSH_DIR, and HIBP_PASSPHRASE_FILE paths are
# resolved from this Compose file's directory.

name: hibp

services:
  hibp:
    image: ghcr.io/rogerbergling/hibp:${HIBP_TAG:-latest}
    container_name: hibp
    restart: unless-stopped
    network_mode: host
    user: "65532:65532"
    environment:
      - APP_THEME=${APP_THEME:-dark}
    command:
      - server
      - --db
      - /var/lib/hibp/hibp.db
      - --listen
      - ${HIBP_LISTEN:-127.0.0.1:8443}
      - --key-dir
      - /etc/hibp/ssh
      - --ssh-config
      - /etc/hibp/ssh/config
      - --passphrase-file
      - /etc/hibp/db.passphrase
    volumes:
      - ${HIBP_DATA_DIR:-./data}:/var/lib/hibp
      - ${HIBP_SSH_DIR:-./secrets/ssh}:/etc/hibp/ssh:ro
      - ${HIBP_PASSPHRASE_FILE:-./secrets/db.passphrase}:/etc/hibp/db.passphrase:ro
    read_only: true
    # The controller runs as UID/GID 65532. mode=1777 is the standard sticky
    # world-writable /tmp mode and is accepted by Docker/Compose versions that
    # reject uid/gid tmpfs options.
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    cpus: 2.0
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
